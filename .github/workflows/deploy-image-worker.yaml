name: deploy image Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/image/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-image-worker.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-image-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec vitest run workers

      - run: pnpm exec tsc -p workers/image

      # The token has Workers Scripts:Edit only. The Worker shell and its
      # route are managed by Terraform outside this repo, so this job can
      # replace the code but not change routing or DNS.
      - run: pnpm run deploy.image
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_APP_DEPLOY_TOKEN }}
