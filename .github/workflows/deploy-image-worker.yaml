name: deploy image Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/image/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-image-worker.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-image-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec vitest run workers

      - run: pnpm exec tsc -p workers/image

      # The token has Workers Scripts:Edit only. The Worker shell and its
      # route are managed by Terraform outside this repo, so this job can
      # replace the code but not change routing or DNS.
      - run: pnpm run deploy.image
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_APP_DEPLOY_TOKEN }}
