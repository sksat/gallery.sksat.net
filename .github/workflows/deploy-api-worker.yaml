name: deploy API Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/api/**"
      # The tests run the queries on the admin's migrations.
      - "admin/migrations/**"
      # Bundled into the Worker (tag fields' checks and projection).
      - "shared/tag-field/**"
      # Bundled into the Worker (resized copies' claims).
      - "shared/resized/**"
      # Bundled into the Worker (the world page's preview).
      - "shared/vrchat/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-api-worker.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-api-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The deploy secrets live in this environment, which only main can use.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec vitest run workers

      - run: pnpm exec tsc -p workers/api

      # The token may edit this Worker's script only. The Worker shell and its
      # route are managed by Terraform outside this repo, so this job can
      # replace the code but not change routing or DNS. The D1 binding is
      # read-only in practice: the code only runs SELECTs, and the schema is
      # migrated from admin/.
      - run: pnpm run deploy.api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_APP_DEPLOY_TOKEN }}
