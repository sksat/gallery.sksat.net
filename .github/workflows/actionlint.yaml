name: actionlint

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    paths:
      - ".github/workflows/**"

jobs:
  actionlint:
    name: actionlint with reviewdog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: actionlint
        uses: reviewdog/action-actionlint@01d2dd67e3525e5a0ce72e8fa38e5a3ab65e2ded # v1.72
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
