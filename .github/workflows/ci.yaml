name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm run build.types

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm run fmt.check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm run test.e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  vrt:
    runs-on: ubuntu-latest
    # Run inside the official Playwright image, the same one used to generate
    # the baselines (see CLAUDE.md), so fonts match. On the bare runner the
    # system fonts differ and text-heavy screenshots exceed the 1% threshold.
    # Keep the tag in sync with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Playwright image ships Node.js 26, which no longer bundles
      # corepack (and `npm i -g corepack` collides with its preinstalled
      # yarn), so install the pnpm pinned in packageManager directly.
      - run: npm install -g "$(node -p 'require("./package.json").packageManager')"

      # Same manual pnpm store cache as admin-e2e.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm run test.vrt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: vrt-diff
          path: |
            test-results/
            playwright-report/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

  admin-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: admin/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
          cache-dependency-path: admin/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm run build.types

      - run: pnpm run build

  # Whether admin-e2e has anything to test: on a pull request, only when it
  # changes admin/, shared/ (which admin imports) or this workflow.
  admin-changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      # The merge commit and its first parent, the base branch.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ] ||
            git diff --no-renames --name-only HEAD^1 HEAD |
            grep -qE '^(admin/|shared/|\.github/workflows/ci\.yaml$)'; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
          fi

  # The admin E2E in groups (ADMIN_E2E_GROUP in admin/playwright.config.ts)
  # and the admin VRT, side by side, each job with its own server and a fresh
  # D1.
  admin-e2e-group:
    name: admin-e2e (${{ matrix.group }})
    needs: admin-changes
    if: needs.admin-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [selection, upload, upload-rule, media, later, rest, vrt]
    # Run inside the official Playwright image so font rendering is byte-identical
    # to the environment used for VRT baseline generation (`podman run … mcr.microsoft.com/playwright:vX-noble`).
    # Keep the tag in sync with @playwright/test in admin/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # See the vrt job: Node.js 26 in the image has no bundled corepack.
      - run: npm install -g "$(node -p 'require("./package.json").packageManager')"

      # Cache pnpm store. We cannot use pnpm/action-setup or actions/setup-node's
      # built-in pnpm cache here because they require Node 20+ and the
      # Playwright image's environment differs; a manual cache keyed on the
      # lockfile keeps the install fast.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-admin-${{ runner.os }}-${{ hashFiles('admin/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-admin-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # The firefox project's drops (upload.spec.ts) go with upload-rule, the
      # shortest group.
      - if: matrix.group != 'vrt'
        run: >-
          pnpm exec playwright test --project=e2e
          ${{ matrix.group == 'upload-rule' && '--project=firefox' || '' }}
        env:
          ADMIN_E2E_GROUP: ${{ matrix.group }}
          # Firefox (the `firefox` project) refuses to start as root with a
          # $HOME owned by another user, as the container's is.
          HOME: /root

      - if: matrix.group == 'vrt'
        run: pnpm run test.vrt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: admin-playwright-report-${{ matrix.group }}
          path: |
            admin/playwright-report/
            admin/test-results/

  # The required check: passes when every group passed, or when the pull
  # request does not touch the admin.
  admin-e2e:
    needs: [admin-changes, admin-e2e-group]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.admin-changes.result }}
          RUN: ${{ needs.admin-changes.outputs.run }}
          GROUP_RESULT: ${{ needs.admin-e2e-group.result }}
        run: |
          echo "admin-changes: $CHANGES (run=$RUN), groups: $GROUP_RESULT"
          [ "$CHANGES" = success ] || exit 1
          if [ "$RUN" = true ]; then
            [ "$GROUP_RESULT" = success ]
          else
            [ "$GROUP_RESULT" = skipped ]
          fi
