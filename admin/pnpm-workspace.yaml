# pnpm settings (pnpm 11+ no longer reads the "pnpm" field in package.json).
# A single-package project: without `packages`, only this directory is in
# the workspace. The repo root has its own pnpm-workspace.yaml.

# Cooldown: refuse package versions published less than a day ago (in
# minutes), so a hijacked release has time to be caught and unpublished
# before it reaches us. Set explicitly (pnpm 12's default is the same) so
# the check is strict. Renovate waits 3 days before proposing an update
# (renovate.json), so its PRs normally pass this.
minimumReleaseAge: 1440

# Packages whose install scripts may run (native binaries).
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# pnpm 12 refuses versions published less than a day ago (minimumReleaseAge,
# 1440 minutes by default). These exact versions were already in the
# lockfile, installed and tested in CI before the switch to pnpm 12, but
# were less than a day old at that time. They are all older than a day from
# 2026-11-19, so this list can be removed then.
minimumReleaseAgeExclude:
  - "@cloudflare/workerd-darwin-64@1.20261117.1"
  - "@cloudflare/workerd-darwin-arm64@1.20261117.1"
  - "@cloudflare/workerd-linux-64@1.20261117.1"
  - "@cloudflare/workerd-linux-arm64@1.20261117.1"
  - "@cloudflare/workerd-windows-64@1.20261117.1"
  - "@rollup/rollup-android-arm-eabi@4.68.5"
  - "@rollup/rollup-android-arm64@4.68.5"
  - "@rollup/rollup-android-x64@4.68.5"
  - "@rollup/rollup-darwin-arm64@4.68.5"
  - "@rollup/rollup-darwin-x64@4.68.5"
  - "@rollup/rollup-freebsd-arm64@4.68.5"
  - "@rollup/rollup-freebsd-x64@4.68.5"
  - "@rollup/rollup-linux-arm-gnueabihf@4.68.5"
  - "@rollup/rollup-linux-arm-musleabihf@4.68.5"
  - "@rollup/rollup-linux-arm64-gnu@4.68.5"
  - "@rollup/rollup-linux-arm64-musl@4.68.5"
  - "@rollup/rollup-linux-loong64-gnu@4.68.5"
  - "@rollup/rollup-linux-loong64-musl@4.68.5"
  - "@rollup/rollup-linux-ppc64-gnu@4.68.5"
  - "@rollup/rollup-linux-ppc64-musl@4.68.5"
  - "@rollup/rollup-linux-riscv64-gnu@4.68.5"
  - "@rollup/rollup-linux-riscv64-musl@4.68.5"
  - "@rollup/rollup-linux-s390x-gnu@4.68.5"
  - "@rollup/rollup-linux-x64-gnu@4.68.5"
  - "@rollup/rollup-linux-x64-musl@4.68.5"
  - "@rollup/rollup-openbsd-x64@4.68.5"
  - "@rollup/rollup-openharmony-arm64@4.68.5"
  - "@rollup/rollup-win32-arm64-msvc@4.68.5"
  - "@rollup/rollup-win32-ia32-msvc@4.68.5"
  - "@rollup/rollup-win32-x64-gnu@4.68.5"
  - "@rollup/rollup-win32-x64-msvc@4.68.5"
  - "ignore@7.0.16"
  - "miniflare@5.20261117.0-beta"
  - "rollup@4.68.5"
  - "workerd@1.20261117.1"
  - "wrangler@4.164.0"

overrides:
  # vitest 3.x only allows tinypool ^1, which has known vulnerabilities.
  "vitest>tinypool": "^2.1.2"
  # vite-imagetools (via qwik-city) only allows sharp ^0.34 (libvips CVEs).
  "vite-imagetools>sharp": "^0.35.5"
